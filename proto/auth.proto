syntax = "proto3";

package auth.v1;

import "google/api/annotations.proto";

option go_package = "/";

service AuthService {
  rpc Register (RegisterRequest) returns (RegisterResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/register"
      body: "*"
    };
  }

  rpc Login (LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/login"
      body: "*"
    };
  }

  rpc Refresh (RefreshRequest) returns (RefreshResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/refresh"
      body: "*"
    };
  }

  rpc Logout (LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/logout"
      body: "*"
    };
  }

  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/validate"
      body: "*"
    };
  }

  rpc AssignRole (AssignRoleRequest) returns (AssignRoleResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/roles/assign"
      body: "*"
    };
  }

  rpc GetUserRoles (GetUserRolesRequest) returns (GetUserRolesResponse) {
    option (google.api.http) = {
      get: "/api/v1/auth/roles/{user_id}"
    };
  }

  rpc ForgotPassword (ForgotPasswordRequest) returns (ForgotPasswordResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/forgot-password"
      body: "*"
    };
  }

  rpc ResetPassword (ResetPasswordRequest) returns (ResetPasswordResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/reset-password"
      body: "*"
    };
  }

  rpc OAuthLogin (OAuthLoginRequest) returns (OAuthLoginResponse) {
    option (google.api.http) = {
      get: "/api/v1/auth/oauth/{provider}"
    };
  }

  rpc OAuthCallback (OAuthCallbackRequest) returns (OAuthCallbackResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/oauth/exchange"
      body: "*"
    };
  }

  rpc VerifyOTP  (VerifyOTPRequest)  returns (VerifyOTPResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/verify-otp"
      body: "*"
    };
  }

  rpc Setup2FA   (Setup2FARequest)   returns (Setup2FAResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/2fa/setup"
      body: "*"
    };
  }

  rpc Enable2FA  (Enable2FARequest)  returns (Enable2FAResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/2fa/enable"
      body: "*"
    };
  }
  
  rpc Disable2FA (Disable2FARequest) returns (Disable2FAResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/2fa/disable"
      body: "*"
    };
  }

  // SetupSyncKey stores the client-wrapped clipboard data key (E2EE).
  // The server never receives the passphrase, the derived key-encryption
  // key, or the plaintext data key — only an opaque wrapped blob.
  rpc SetupSyncKey (SetupSyncKeyRequest) returns (SetupSyncKeyResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/sync-key/setup"
      body: "*"
    };
  }

  // GetSyncKey returns the wrapped data key + non-secret salt/KDF params so
  // a device can re-derive the key-encryption key locally and unwrap it.
  rpc GetSyncKey (GetSyncKeyRequest) returns (GetSyncKeyResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/sync-key"
      body: "*"
    };
  }

  rpc VerifyEmail (VerifyEmailRequest) returns (VerifyEmailResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/verify-email"
      body: "*"
    };
  }

  rpc ResendVerification (ResendVerificationRequest) returns (ResendVerificationResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/resend-verification"
      body: "*"
    };
  }
}

message Role {
  string id   = 1;
  string name = 2;
}

message RegisterRequest {
  string email    = 1;
  string password = 2;
  string name     = 3;
  string role     = 4;
}

message RegisterResponse {
  string user_id = 1;
  string email   = 2;
  string message = 3;
  bool   verification_required = 4;
}

message LoginRequest {
  string email    = 1;
  string password = 2;
}

message LoginResponse {
  string access_token  = 1;
  string refresh_token = 2;
  int64  expires_in    = 3;
  string token_type    = 4;
  bool   requires_2fa  = 5;
  string temp_token    = 6; // to verify otp
}

message RefreshRequest {
  string refresh_token = 1;
}

message RefreshResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64  expires_in   = 3;
}

message LogoutRequest {
  string access_token = 1;
}

message LogoutResponse {
  bool   success = 1;
  string message = 2;
}

message ValidateTokenRequest {
  string token            = 1;
  string canonical_method = 2;
  string canonical_path   = 3;
  string canonical_date   = 4;
  string service_name     = 5;
  string canonical_sig    = 6;
}

message ValidateTokenResponse {
  bool            valid   = 1;
  string          user_id = 2;
  string          email   = 3;
  repeated string roles   = 4;
  string          error   = 5;
}

message AssignRoleRequest {
  string user_id   = 1;
  string role_name = 2;
}

message AssignRoleResponse {
  bool   success = 1;
  string message = 2;
}

message GetUserRolesRequest {
  string user_id = 1;
}

message GetUserRolesResponse {
  repeated Role roles = 1;
}

message ForgotPasswordRequest {
  string email = 1;
}

message ForgotPasswordResponse {
  string message = 1;
}

message ResetPasswordRequest {
  string token = 1;
  string new_password = 2;
}

message ResetPasswordResponse {
  bool   success = 1;
  string message = 2;
}

message OAuthLoginRequest {
  string provider = 1; // "google" | "github"
  string app_redirect_uri = 2;
}

message OAuthLoginResponse {
  string redirect_url = 1;
}

message OAuthCallbackRequest {
  string provider = 1;
  string code     = 2;
  string state    = 3;
}

message OAuthCallbackResponse {
  string access_token  = 1;
  string refresh_token = 2;
  int64  expires_in    = 3;
  string token_type    = 4;
  bool   is_new_user   = 5;
}

message VerifyOTPRequest {
  string temp_token = 1;
  string otp        = 2;
}

message VerifyOTPResponse {
  string access_token  = 1;
  string refresh_token = 2;
  int64  expires_in    = 3;
  string token_type    = 4;
}

message Setup2FARequest {
  string user_id = 1;
}

message Setup2FAResponse {
  string secret   = 1;
  string qr_url   = 2; // otpauth:// URL for QR code
  string qr_image = 3; // base64 encoded QR image
}

message Enable2FARequest {
  string user_id = 1;
  string otp     = 2; // verify OTP before enabling
}

message Enable2FAResponse {
  bool   success      = 1;
  string message      = 2;
  repeated string backup_codes = 3; // one-time use backup codes
}

message Disable2FARequest {
  string user_id = 1;
  string otp     = 2;
}

message Disable2FAResponse {
  bool   success = 1;
  string message = 2;
}

message SetupSyncKeyRequest {
  string access_token      = 1; // identifies the caller, same pattern as LogoutRequest
  string salt              = 2; // base64, random, generated client-side, not secret
  string kdf_params        = 3; // e.g. "argon2id$m=65536,t=3,p=4"
  string wrapped_dek       = 4; // base64 AES-GCM ciphertext of the data key
  string wrapped_dek_nonce = 5; // base64 nonce used to wrap the data key
}

message SetupSyncKeyResponse {
  bool   success = 1;
  string message = 2;
}

message GetSyncKeyRequest {
  string access_token = 1;
}

message GetSyncKeyResponse {
  bool   configured        = 1; // false until the user has run setup on any device
  string salt              = 2;
  string kdf_params        = 3;
  string wrapped_dek       = 4;
  string wrapped_dek_nonce = 5;
}

message VerifyEmailRequest {
  string email = 1;
  string otp   = 2;
}

message VerifyEmailResponse {
  string access_token  = 1;
  string refresh_token = 2;
  int64  expires_in    = 3;
  string token_type    = 4;
  string message       = 5;
}

message ResendVerificationRequest {
  string email = 1;
}

message ResendVerificationResponse {
  string message = 1;
}
